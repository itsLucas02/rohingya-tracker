<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · TrackX</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #080808;
        color: #fff;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      p {
        color: rgba(255, 255, 255, 0.65);
        font-size: 14px;
        margin: 0;
      }
      button {
        margin-top: 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #fff;
        color: #090909;
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
